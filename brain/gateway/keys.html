<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elyceum — API Keys</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b1b22, #0c0c0f); color: #e7e7ea;
  }
  .card { width: 100%; max-width: 560px; margin: 32px; background: #131318;
    border: 1px solid #26262e; border-radius: 16px; padding: 28px 28px 22px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #9a9aa5; font-size: 13px; margin: 0 0 22px; }
  .row { margin: 0 0 18px; }
  .lab { display: flex; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .req { color: #f0b35b; font-size: 11px; font-weight: 600; }
  .opt { color: #6b6b76; font-size: 11px; font-weight: 500; }
  .on  { color: #6ee7a8; font-size: 12px; font-weight: 600; }
  .hint { color: #8a8a95; font-size: 12px; margin: 4px 0 0; }
  .hint a { color: #9ab8ff; }
  .inputrow { display: flex; gap: 8px; }
  input { flex: 1; background: #0e0e12; border: 1px solid #2c2c36; border-radius: 9px;
    color: #e7e7ea; padding: 10px 12px; font-size: 14px; font-family: ui-monospace, monospace; }
  input::placeholder { color: #55555f; font-family: -apple-system, sans-serif; }
  button { border: 0; border-radius: 9px; padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .save { background: #3b5bdb; color: #fff; }
  .save:hover { background: #4c6ef5; }
  .clear { background: transparent; color: #b0606a; border: 1px solid #3a2630; }
  .clear:hover { background: #1c1216; }
  .footer { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; }
  .cont { background: #2f9e6e; color: #fff; padding: 11px 18px; }
  .cont:disabled { background: #24343054; color: #6b6b76; cursor: not-allowed; }
  .logout { color: #8a8a95; font-size: 12px; text-decoration: none; }
  .logout:hover { color: #c7c7d0; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #1d1d24; border: 1px solid #2c2c36; color: #e7e7ea; padding: 10px 16px;
    border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="card">
    <h1>API Keys</h1>
    <p class="sub">Your keys are encrypted in the vault and used only by your own brain. We never display
      a stored key — saved keys show as ••••••••.</p>
    <div id="rows"></div>
    <div class="footer">
      <a class="logout" href="#" id="logout">Sign out</a>
      <button class="cont" id="continue" disabled>Continue to Elyceum →</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const PROVIDERS = [
  { id: "anthropic", label: "Anthropic", required: true,
    hint: 'Required. Create a <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">dedicated, spend-capped key</a> (Console → Workspaces → set a spend limit) so a worst case is bounded.' },
  { id: "elevenlabs", label: "ElevenLabs", required: false, hint: "Optional — enables voice output." },
  { id: "deepgram", label: "Deepgram", required: false, hint: "Optional — enables voice input (speech-to-text)." },
  { id: "google", label: "Google", required: false, hint: "Optional — enables image understanding." },
];
const rows = document.getElementById("rows");
const toastEl = document.getElementById("toast");
let toastT;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2200); }

function render(status) {
  rows.innerHTML = "";
  for (const p of PROVIDERS) {
    const set = !!status[p.id];
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `
      <div class="lab">${p.label}
        ${p.required ? '<span class="req">REQUIRED</span>' : '<span class="opt">optional</span>'}
        ${set ? '<span class="on">• Key on file ✓</span>' : ''}
      </div>
      <div class="inputrow">
        <input type="password" autocomplete="off" placeholder="${set ? '••••••••  (leave blank to keep)' : 'paste key'}" data-p="${p.id}">
        <button class="save" data-save="${p.id}">Save</button>
        ${set ? `<button class="clear" data-clear="${p.id}">Clear</button>` : ''}
      </div>
      <p class="hint">${p.hint}</p>`;
    rows.appendChild(row);
  }
  document.getElementById("continue").disabled = !status.anthropic;
}

async function load() {
  const r = await fetch("/api/keys", { headers: { accept: "application/json" } });
  render(await r.json());
}
async function save(provider) {
  const input = document.querySelector(`input[data-p="${provider}"]`);
  const value = input.value.trim();
  if (!value) { toast("Nothing to save (blank keeps the current key)"); return; }
  const r = await fetch("/api/keys", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ provider, value }) });
  if (r.ok) { input.value = ""; toast(provider + " key saved"); await load(); }
  else { toast("Save failed"); }
}
async function clearKey(provider) {
  const r = await fetch("/api/keys/" + provider, { method: "DELETE" });
  if (r.ok) { toast(provider + " key removed"); await load(); } else { toast("Remove failed"); }
}
rows.addEventListener("click", (e) => {
  const s = e.target.getAttribute("data-save"); if (s) return save(s);
  const c = e.target.getAttribute("data-clear"); if (c) return clearKey(c);
});
document.getElementById("continue").addEventListener("click", () => { location.href = "/"; });
document.getElementById("logout").addEventListener("click", async (e) => {
  e.preventDefault(); await fetch("/auth/logout", { method: "POST" }); location.href = "/login";
});
load();
</script>
</body>
</html>
