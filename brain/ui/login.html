<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Elyceum</title>
  <style>
    :root {
      --bg:     oklch(0.16 0.012 250);
      --panel:  oklch(0.20 0.014 250);
      --fg:     oklch(0.96 0.005 250);
      --fg-dim: oklch(0.72 0.014 250);
      --fg-mute:oklch(0.55 0.018 250);
      --accent: oklch(0.78 0.140 220);
      --accent-soft: oklch(0.78 0.140 220 / 0.16);
      --border: oklch(0.32 0.012 250);
      --danger: oklch(0.68 0.170 25);
      --sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .wordmark {
      font-family: var(--mono);
      font-size: 22px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      color: var(--fg);
      margin: 0 0 4px;
    }
    .tag {
      text-align: center;
      color: var(--fg-mute);
      font-size: 12px;
      letter-spacing: 0.04em;
      margin: 0 0 26px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--fg-dim);
      margin: 0 0 6px;
      letter-spacing: 0.02em;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%;
      padding: 11px 12px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    button:hover { background: var(--accent); color: var(--bg); }
    button:disabled { opacity: 0.5; cursor: default; }
    .error {
      display: none;
      margin: 0 0 16px;
      padding: 10px 12px;
      background: oklch(0.68 0.170 25 / 0.12);
      border: 1px solid var(--danger);
      border-radius: 8px;
      color: var(--danger);
      font-size: 12.5px;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <h1 class="wordmark">Elyceum</h1>
    <p class="tag">Sign in to continue</p>
    <div class="error" id="error"></div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="submit">Sign in</button>
  </form>
  <script>
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || '/';
    const form = document.getElementById('form');
    const errorEl = document.getElementById('error');
    const submit = document.getElementById('submit');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      submit.disabled = true;
      submit.textContent = 'Signing in…';
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            next,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          window.location.assign(data.next || '/');
          return;
        }
        showError(data.error || 'Invalid credentials');
      } catch (err) {
        showError('Network error. Please try again.');
      } finally {
        submit.disabled = false;
        submit.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
