<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Elyceum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --paper:    #fbf7f0;
  --paper-2:  oklch(0.945 0.016 83);
  --paper-3:  oklch(0.912 0.019 82);

  --ink:      oklch(0.27 0.022 54);
  --ink-2:    oklch(0.42 0.022 54);
  --ink-3:    oklch(0.55 0.020 56);
  --ink-4:    oklch(0.68 0.016 60);

  --line:       oklch(0.30 0.02 54 / 0.24);
  --line-soft:  oklch(0.30 0.02 54 / 0.12);
  --line-faint: oklch(0.30 0.02 54 / 0.07);

  --signal:      oklch(0.56 0.185 33);
  --signal-deep: oklch(0.48 0.17 32);
  --signal-soft: oklch(0.56 0.185 33 / 0.12);

  --serif: 'Newsreader', Georgia, serif;
  --sans:  'Hanken Grotesk', system-ui, sans-serif;
  --mono:  'JetBrains Mono', ui-monospace, monospace;
  --r-1: 5px;
}
* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 48px 24px;
  background-image: radial-gradient(oklch(0.30 0.02 54 / 0.025) 0.5px, transparent 0.6px);
  background-size: 4px 4px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
::selection { background: var(--signal-soft); }
.eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-4); }

.card { width: 100%; max-width: 468px; display: flex; flex-direction: column; align-items: center; }

/* ---- emblem ---- */
.emblem { width: 100%; display: flex; flex-direction: column; align-items: center; }
.emblem img {
  width: 100%; max-width: 468px; height: auto; display: block;
}
.emblem .rule { display: flex; align-items: center; gap: 12px; width: 70%; margin-top: 4px; }
.emblem .rule::before, .emblem .rule::after { content: ''; flex: 1; border-top: 1px solid var(--line-soft); }
.emblem .rule span { font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--ink-4); white-space: nowrap; }

/* ---- form ---- */
.form-inner { width: 100%; margin-top: 30px; }
.head { text-align: center; }
.head h1 { font-family: var(--serif); font-size: 30px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.06; }
.head h1 em { font-style: italic; color: var(--ink-2); }
.head .sub { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink-3); margin-top: 9px; line-height: 1.5; text-wrap: pretty; }

form { margin-top: 28px; max-width: 408px; margin-left: auto; margin-right: auto; }
.head, .foot { max-width: 408px; margin-left: auto; margin-right: auto; }
.field-group { margin-bottom: 20px; }
.field-label { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 7px; }
.field-label label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
.field-label .aux { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.04em; color: var(--ink-4); text-decoration: none; transition: color 150ms; }
.field-label .aux:hover { color: var(--signal-deep); }
.entry-line { display: flex; align-items: center; gap: 11px; border-bottom: 1.5px solid var(--line); padding-bottom: 9px; transition: border-color 220ms; }
.entry-line:focus-within { border-color: var(--ink); }
.entry-line .lead { color: var(--ink-4); display: flex; transition: color 220ms; }
.entry-line:focus-within .lead { color: var(--signal-deep); }
.entry-line .lead svg { width: 16px; height: 16px; }
.entry-line input { flex: 1; min-width: 0; background: none; border: none; outline: none;
  font-family: var(--serif); font-size: 16px; color: var(--ink); padding: 2px 0; }
.entry-line input::placeholder { color: var(--ink-4); font-style: italic; }
.reveal { color: var(--ink-4); display: flex; padding: 2px; transition: color 150ms; }
.reveal:hover { color: var(--ink-2); }
.reveal svg { width: 16px; height: 16px; }

.row-between { display: flex; align-items: center; margin: 2px 0 24px; }
.remember { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
.checkbox { width: 17px; height: 17px; border: 1.4px solid var(--line); border-radius: 4px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: background 160ms, border-color 160ms; }
.checkbox svg { width: 11px; height: 11px; color: var(--paper); opacity: 0; transition: opacity 140ms; }
.remember.on .checkbox { background: var(--ink); border-color: var(--ink); }
.remember.on .checkbox svg { opacity: 1; }
.remember span { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }

.signin { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--ink); color: var(--paper); border-radius: var(--r-1); padding: 15px 20px;
  font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
  transition: background 180ms, transform 120ms; }
.signin:hover { background: var(--signal-deep); }
.signin:active { transform: translateY(1px); }
.signin svg { width: 15px; height: 15px; transition: transform 200ms; }
.signin:hover svg { transform: translateX(3px); }

.or { display: flex; align-items: center; gap: 14px; margin: 20px 0; }
.or::before, .or::after { content: ''; flex: 1; border-top: 1px solid var(--line-faint); }
.or span { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-4); }

.passkey { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  border: 1.3px solid var(--line); color: var(--ink-2); border-radius: var(--r-1); padding: 13px 20px;
  font-size: 13px; font-weight: 500; transition: background 160ms, border-color 160ms, color 160ms; }
.passkey:hover { background: var(--paper-2); border-color: var(--ink-4); color: var(--ink); }
.passkey svg { width: 16px; height: 16px; }

.new-here { text-align: center; margin-top: 26px; font-size: 12.5px; color: var(--ink-3); }
.new-here a { color: var(--ink); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; transition: border-color 160ms, color 160ms; }
.new-here a:hover { border-color: var(--signal-deep); color: var(--signal-deep); }

.foot { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 34px;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4); }
.foot i { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); animation: pulse 2.6s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 oklch(0.56 0.185 33 / 0.45); } 70%,100% { box-shadow: 0 0 0 7px oklch(0.56 0.185 33 / 0); } }
.foot .dot { color: var(--line); }

@media (max-width: 480px) {
  body { padding: 32px 20px; }
  .head h1 { font-size: 26px; }
}

/* --- auth states --- */
.signin:disabled { opacity: 0.6; cursor: default; }
.signin:disabled:hover { background: var(--ink); }
.error { display: none; max-width: 408px; margin: 0 auto 2px; padding: 10px 14px;
  background: oklch(0.58 0.16 30 / 0.09); border: 1px solid oklch(0.55 0.17 30 / 0.45);
  border-radius: var(--r-1); color: oklch(0.47 0.17 30); font-size: 12.5px; text-align: center; text-wrap: pretty; }
.error.show { display: block; }
.error.ok { background: oklch(0.62 0.10 150 / 0.10); border-color: oklch(0.55 0.11 150 / 0.45); color: oklch(0.42 0.10 150); }
</style>

    var show = pw.type === 'password';

    }
    try {
      await fetch('/auth/forgot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email }),
      });
    } catch (err) { /* still show the same notice — don't leak status */ }
    showNotice('If that email has an account, a reset link is on its way.');
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.classList.remove('show');
    btn.disabled = true;
    label.textContent = 'Entering';
    try {
      var res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          next: next,
          remember: rem.classList.contains('on'),
        }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (res.ok && data.ok) { window.location.assign(data.next || '/'); return; }
      showError(data.error || 'Invalid email or password.');
    } catch (err) {
      showError('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      label.textContent = 'Enter';
    }
  });
})();
</script>
</body>
</html>
