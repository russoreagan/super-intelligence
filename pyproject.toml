[project]
name = "super-intelligence"
version = "0.1.0"
description = "Biologically-inspired multi-agent brain"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.104.0",
    "google-genai>=1.0.0",
    # Upper bounds on packages that have broken us before or have already shipped a
    # breaking major: a bare `>=` floor silently accepts the next major on `uv lock
    # --upgrade` (this is exactly how a deepgram-sdk major jump 500'd every STT
    # request, and how mcp 2.0.0 became eligible). Caps are `<N+1` for the major we
    # run today; bump the cap deliberately when validating a new major.
    "pydantic>=2.0.0,<3.0.0",
    "lancedb>=0.15.0",
    "langfuse>=2.0.0,<5.0.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "deepgram-sdk>=3.0.0,<8.0.0",
    "elevenlabs>=1.0.0,<3.0.0",
    "sounddevice>=0.5.0",
    "fastapi>=0.110.0",
    "httpx>=0.27",
    "scipy>=1.12.0",
    "librosa>=0.10.0",
    "speechbrain>=1.0.0",
    "torchaudio>=2.0.0",
    "opensmile>=2.5.0",
    "supabase>=2.0.0,<3.0.0",
    # Day-trading capability (advise-only). `mcp` is the stdio client for the
    # official Alpaca MCP server (launched via `uvx alpaca-mcp-server`); `yfinance`
    # is the keyless market-data fallback when no Alpaca key is configured.
    "mcp>=1.0.0,<2.0.0",
    "yfinance>=0.2.40,<2.0.0",
    "panns-inference>=0.1.1",
    "openai>=2.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    # Pinned to a minor range: a new ruff minor can add lint rules that retroactively
    # fail CI on unchanged code (which is exactly what broke the build). Bump deliberately.
    "ruff>=0.15,<0.16",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[project.scripts]
brain = "brain.run:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    # UP042 wants `class X(str, Enum)` → `StrEnum`. Deliberately NOT adopted: the two
    # differ in `str()`/f-string output (`"JobState.RUNNING"` vs `"running"`), and the
    # autonomy enums (JobState, DeferReason, StopReason, RunOutcome, BudgetTier) are
    # PERSISTED — JobState lands in agent_jobs.state and is matched by GET /v1/jobs?state=.
    # A silent formatting change there would corrupt stored job state for a style win.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
