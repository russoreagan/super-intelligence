[build]
builder = "nixpacks"

[deploy]
# Multi-tenant gateway: provisions one isolated brain.run subprocess per user
# (flags via BRAIN_TENANT_ARGS, default --ui --dmn --metacognition --ears --voice
# --motor), reverse-proxies to it, and owns the shared RunPod pod. The gateway
# binds /health immediately, so the healthcheck passes well before any tenant
# boots. To revert to a single shared brain, restore:
#   /opt/venv/bin/python -m brain.run --ui --dmn --metacognition --ears --voice --motor
#
# Venv path: nixpacks builds the project venv at /opt/venv (its
# `python -m venv /opt/venv && uv sync` step), NOT /app/.venv. This has
# flip-flopped across nixpacks versions — if start fails with
# "/opt/venv/bin/python: No such file", read the build log for the actual
# `python -m venv <path>` line and match startCommand to it.
# `-u` unbuffers the gateway's own stdout/stderr. Without it Python block-buffers
# (stdout is a pipe on Railway, not a TTY), so logs arrive late and jumbled —
# which is why prior debugging was effectively blind. With -u, [provisioner],
# [tenant:...] relay, and [gateway] lines stream to the dashboard in real time.
startCommand = "/opt/venv/bin/python -u -m brain.gateway"
healthcheckPath = "/health"
# Gateway binds fast, but keep the generous window for the heavy import graph.
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
