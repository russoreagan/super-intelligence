name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        # --locked: fail if uv.lock is stale rather than silently re-locking, so CI
        # tests exactly the pinned graph (prod installs with --frozen via nixpacks).
        run: uv sync --all-groups --locked
      - name: Ruff lint
        run: uv run ruff check brain tests
      - name: Ruff format check
        run: uv run ruff format --check brain tests
      - name: Tests
        run: uv run pytest tests/ -v --timeout=30
      - name: Bandit security scan
        run: uv run bandit -r brain -ll -q
      - name: pip-audit
        # No suppressions: the dependency graph is clean as of the 2026-08-08 upgrade
        # (torch 2.13 fixes CVE-2025-3000; pip past 26.1.2 clears PYSEC-2026-196; the
        # GHSA-2wem-jxmx-mq3h advisory was withdrawn). A new advisory should fail CI so
        # it gets an explicit, deliberate response rather than an accreting ignore list.
        run: uv run pip-audit
