# Control where uv installs the project virtualenv.
#
# nixpacks bootstraps a venv at /opt/venv (pip + uv) and activates it, then runs
# `uv sync`. But uv IGNORES the activated VIRTUAL_ENV and installs into its own
# project env (`.venv`) instead — leaving /opt/venv without the app's deps, so the
# gateway crashes at startup with `ModuleNotFoundError: No module named 'httpx'`
# (the build "succeeds" because uv sync itself runs fine).
#
# We override the install phase to add `--active`, which makes uv sync populate the
# activated /opt/venv — exactly where railway.toml's startCommand
# (/opt/venv/bin/python) looks. (`--no-dev --frozen` mirror nixpacks' defaults.)
[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install uv==0.10.7 && uv sync --no-dev --frozen --active",
]

# The ollama installer unpacks a zstd-compressed bundle and aborts without the
# `zstd` binary ("This version requires zstd for extraction"). That abort was
# swallowed by the `|| true` below for the whole life of the sidecar, so every
# hosted tenant fell back to Google embeddings on the platform's key. apt-install
# it in the setup phase (additive: nixpacks keeps its own nix packages).
[phases.setup]
aptPkgs = ["zstd"]

# Ship the ollama binary so the gateway can run its CPU embedding sidecar
# (nomic-embed-text on Railway CPU — see _start_embed_sidecar in
# brain/gateway/server.py). CPU-only: no GPU on Railway, the installer's driver
# detection just no-ops. The embed model itself (~0.3 GB) is pulled at gateway
# startup, not baked into the image. Failure is tolerated (|| true): without the
# binary the sidecar no-ops and embeds fall back to the pod/Google chain exactly
# as before this existed — but the gateway now logs WHICH paths it probed, so a
# silent install failure shows up in the deploy log instead of in the Google bill.
[phases.ollama]
dependsOn = ["install"]
cmds = ["curl -fsSL https://ollama.com/install.sh | sh || true"]
